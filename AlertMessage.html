<html>

<head>
    <title>Alert Message - very simple application</title>
    <script>
        //javascript
        function Upozorenje() {
            alert('Hvala što ste koristili dugme!');
        }
    </script>

</head>

<body>
    <h1>Ovo je dugme koje prikazuje poruku upozorenja</h1>
    <br>
    <button onclick='Upozorenje()'> Press for alert message</button>


</body>

</html>
