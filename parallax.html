<!DOCTYPE html>
<head>

    <!--Lines for responsivness and css file linking.-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- In the body, we arrange the elements the way we want them to look,
    with little or no change to the style of the page.-->

     <!--Parallax section: the image that will be seen behind.-->
    <div class="parallax"></div>

    <!--Div tags that go over the parallax image. 
    Here goes content you would like to display to a web visitor.-->
    <div class="content">
        <hr / color='white'>
        <h1>PARALLAX EFFECT</h1>
        <h3>This is a basic example of a parallax.</h3>
    </div>

    <!--Parallax section again-->
    <div class="parallax"></div>

    <div class="content">
        <hr / color='white'>
        <h3>In science it represents the fact that closer objects appear to move faster.</h3>
    </div>

    <div class="parallax"></div>

    <div class="content">
        <hr / color='white'>
        <h3>In CSS, this is a very useful way of styling a page.</h3>
    </div>

    <div class="parallax"></div>

    <div class="content">
        <hr / color='white'>
        <h3>Photo by Stas Knop: https://www.pexels.com/photo/white-mug-on-red-background-2916450/</h3>
    </div>

</body>

</html>
